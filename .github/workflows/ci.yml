name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

  integration:
    name: VS Code ${{ matrix.vscode-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ["1.85.0", "stable"]
    env:
      VSCODE_VERSION: ${{ matrix.vscode-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v6
        if: matrix.vscode-version != 'stable'
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ matrix.vscode-version }}-${{ hashFiles('src/test/runTest.ts') }}
      - run: npm ci
      - name: Run the extension in VS Code ${{ matrix.vscode-version }}
        run: xvfb-run -a npm run test:integration
