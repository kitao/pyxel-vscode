name: Release v1.0.3

on:
  push:
    branches: ["codex/publish-pyxel-vscode-1.0.3"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v1.0.3
      RELEASE_COMMIT: f20163f2ed183dcacc051f7553867e5fcb5f8651
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f20163f2ed183dcacc051f7553867e5fcb5f8651
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - name: Extract the release notes from the changelog
        run: |
          awk -v v="${RELEASE_TAG#v}" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Run the extension in the oldest supported VS Code
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: "1.85.0"
      - name: Run the extension in the current stable VS Code
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: "stable"
      - run: gh release create "$RELEASE_TAG" ./*.vsix --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
