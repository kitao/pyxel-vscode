version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Matches the Node runtime of the oldest supported VS Code.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Tracks engines.vscode and moves only when the minimum VS Code does.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # typescript-eslint pins typescript below 6.1, so a major here cannot
      # install. Bump it by hand once typescript-eslint supports the release.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
